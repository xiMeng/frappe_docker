services:
  create-site:
    image: frappe/erpnext:v16.51.0
    restart: "no"
    depends_on:
      configurator:
        condition: service_completed_successfully
    environment:
      # PIP/UV 安装镜像源，可在 .env 或 shell 环境变量中覆盖
      # https 镜像示例：https://pypi.tuna.tsinghua.edu.cn/simple（默认）/ https://mirrors.aliyun.com/pypi/simple/
      # http 镜像示例：http://mirrors.example.com/pypi/simple/，此时需同时设置下面两个可信主机变量
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
      UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      UV_INSECURE_HOST: ${UV_INSECURE_HOST:-}
    volumes:
      # sites 是建站必需；apps/env 卷统一由 compose.apps-volume.yaml 分配
      - sites:/home/frappe/frappe-bench/sites
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ ! -d "apps/erpnext_china" ]; then
          echo "Downloading erpnext_china from gitee";
          # timeout 防止 get-app 在安装/构建完成后因子进程管道未释放而挂起不退出（低配服务器偶发）
          timeout 30 bench get-app https://gitee.com/yuzelin/erpnext_china.git || echo "WARN: bench get-app timed out or failed, continuing";
        elif ! env/bin/python -c "import erpnext_china" 2>/dev/null; then
          echo "erpnext_china exists but missing from env, reinstalling into shared env";
          uv pip install --no-deps --quiet -e apps/erpnext_china --python env/bin/python;
        fi;
        ls -1 apps > sites/apps.txt;
        if [ -d "sites/${FRAPPE_SITE_NAME_HEADER:-frontend}" ]; then
          echo "Site ${FRAPPE_SITE_NAME_HEADER:-frontend} already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=${ADMIN_PASSWORD:-admin} --db-root-username=root --db-root-password=${DB_PASSWORD:-123} --install-app erpnext --set-default ${FRAPPE_SITE_NAME_HEADER:-frontend};
          bench --site ${FRAPPE_SITE_NAME_HEADER:-frontend} install-app erpnext_china;
        fi;

  frontend:
    depends_on:
      create-site:
        condition: service_completed_successfully

  # 等待 create-site 完成（含 erpnext_china 写入共享 env），再启动各服务
  backend:
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    depends_on:
      create-site:
        condition: service_completed_successfully
