services:
  create-site:
    image: frappe/erpnext:v16.51.0
    restart: "no"
    depends_on:
      configurator:
        condition: service_completed_successfully
    environment:
      # PIP/UV 安装镜像源，可在 .env 或 shell 环境变量中覆盖
      # https 镜像示例：https://pypi.tuna.tsinghua.edu.cn/simple（默认）/ https://mirrors.aliyun.com/pypi/simple/
      # http 镜像示例：http://mirrors.example.com/pypi/simple/，此时需同时设置下面两个可信主机变量
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
      UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://mirrors.aliyun.com/pypi/simple}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      UV_INSECURE_HOST: ${UV_INSECURE_HOST:-}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - apps:/home/frappe/frappe-bench/apps
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ ! -d "apps/erpnext_china" ]; then
          echo "Downloading erpnext_china from gitee";
          bench get-app https://gitee.com/yuzelin/erpnext_china.git;
        fi;
        ls -1 apps > sites/apps.txt;
        if [ -d "sites/${SET_SITE_NAME:-frontend}" ]; then
          echo "Site ${SET_SITE_NAME:-frontend} already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=${ADMIN_PASSWORD:-admin} --db-root-username=root --db-root-password=${DB_PASSWORD:-123} --install-app erpnext --install-app erpnext_china --set-default ${SET_SITE_NAME:-frontend};
        fi;

  frontend:
    depends_on:
      create-site:
        condition: service_completed_successfully
