# 将 apps 目录持久化到独立卷：官方镜像中的 frappe/erpnext 会在卷首次创建时自动播种，
# create-site 首次启动时从 gitee 现下载 erpnext_china 进该卷，其余服务共享读取应用代码。
# 同时共享 env 虚拟环境卷：create-site 中 uv/pip 对 erpnext_china 的 editable 安装
# 写入共享 env，backend 等服务才能 import erpnext_china（否则报 ModuleNotFoundError）。
# 无需构建自定义镜像。
# 注意：升级 ERPNext 镜像版本时必须删除这两个卷，否则卷内旧版代码/依赖会遮蔽新镜像：
#   docker compose -p cryperp -f docker-compose.yml down -v
services:
  configurator:
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env

  backend:
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env

  websocket:
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env

  queue-short:
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env

  queue-long:
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env

  scheduler:
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env

  create-site:
    volumes:
      - apps:/home/frappe/frappe-bench/apps
      - env:/home/frappe/frappe-bench/env

volumes:
  apps:
  env:
